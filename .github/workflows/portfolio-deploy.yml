name: Portfolio deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: portfolio-production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.PORTFOLIO_CONFIG_JSON).subscription_id }}
      PORTFOLIO_CONFIG_JSON: ${{ secrets.PORTFOLIO_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.7'
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
      - run: az extension add --name containerapp --upgrade --only-show-errors
      - run: python -m pip install -r webapp/requirements-deploy.txt
      - run: python webapp/deploy/portfolio/github_release.py
      # Terraform state/plans/configuration are never uploaded as Actions artifacts.
      - name: Remove ephemeral configuration and plans
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath portfolio-deployment.local.json -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath .ci-runtime/portfolio -Recurse -Force -ErrorAction SilentlyContinue

