name: Scraper CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scraper-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test -test-directory=verification -no-color
      - run: |
          terraform -chdir=../azure-devops fmt -check -recursive
          terraform -chdir=../azure-devops init -backend=false -input=false
          terraform -chdir=../azure-devops validate
          terraform -chdir=../azure-devops test -test-directory=verification -no-color
  unit-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=80 --junitxml=reports/unit.xml
      - run: python scripts/evaluate_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-security-results
          path: reports/
          retention-days: 7
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-browser.txt --strict
      - run: python -m pip_audit -r requirements-agent.txt --strict
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/container_ci.py
      - run: python scripts/agent_container_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-results
          path: reports/
          retention-days: 7
