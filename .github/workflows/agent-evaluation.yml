name: Manual retail model evaluation
on:
  workflow_dispatch:
    inputs:
      max_cost_usd:
        description: Whole-run OpenAI USD cap (maximum 10)
        required: true
        default: '0.50'
      repeats:
        description: Repeats per synthetic case (1-10)
        required: true
        default: '3'
permissions:
  contents: read
jobs:
  evaluate:
    # Configure this environment with required reviewers and protected branches.
    environment: retail-model-evaluation
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-agent.txt
      - name: Evaluate synthetic fixtures with GPT-5 mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_CAP: ${{ inputs.max_cost_usd }}
          EVAL_REPEATS: ${{ inputs.repeats }}
        run: python scripts/evaluate_research.py --live-model --max-cost-usd "$EVAL_CAP" --repeats "$EVAL_REPEATS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanitized-agent-evaluation
          path: reports/agent-evaluation.json
          retention-days: 7
